<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4b3427">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ひるしか Ver.0.5</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f6efe4;--card:#fffaf2;--ink:#4b3427;--accent:#c78c52;--line:#e6d3bf;--soft:#f0e3d5;--ok:#e7f1e6}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Noto Sans JP','Segoe UI',sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:560px;margin:auto;min-height:100dvh;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:0 10px 30px #6b4b2d18;min-height:calc(100dvh - 32px);display:flex;flex-direction:column}.hidden{display:none}.hero{align-items:center;text-align:center;justify-content:center}.brand{width:170px;height:170px;object-fit:cover;border-radius:50%;margin-bottom:10px}.mini{width:76px;height:76px;object-fit:cover;border-radius:50%;display:block;margin:0 auto 8px}.title{font-size:38px;font-weight:900}.sub{opacity:.75;line-height:1.7;margin:4px 0 28px}.btns{display:grid;gap:10px;margin-top:auto}.btn{width:100%;min-height:54px;border-radius:17px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:16px;font-weight:750;padding:12px 14px}.btn:disabled{opacity:.45;background:#eee6dc}.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.danger{font-size:14px;min-height:44px;opacity:.7}.ghost{background:transparent}.small{font-size:13px;min-height:40px}.chat{display:flex;flex-direction:column;gap:12px;margin:10px 0 14px;overflow:auto;max-height:55dvh;padding-right:2px}.msg{max-width:88%;padding:12px 14px;border-radius:18px;line-height:1.65;white-space:pre-line;font-size:17px}.ai{align-self:flex-start;background:var(--soft);border-bottom-left-radius:6px}.user{align-self:flex-end;background:#fff;border:1px solid var(--line);border-bottom-right-radius:6px}.typing{opacity:.65;font-style:italic}.composer{display:flex;gap:8px;margin-top:10px}.composer textarea{flex:1;min-height:50px;max-height:120px;resize:vertical;border:1px solid var(--line);border-radius:15px;padding:12px;font-size:16px;background:#fff}.send{width:78px}.quick{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 2px}.chip{border:1px solid var(--line);border-radius:999px;background:#fff;padding:9px 12px;font-size:14px;color:var(--ink)}.chip:disabled{opacity:.45}.meta{display:flex;justify-content:space-between;font-size:13px;opacity:.65}.progress{height:8px;background:#eadbcb;border-radius:99px;overflow:hidden;margin:10px 0}.progress div{height:100%;background:var(--accent)}input,select{width:100%;font-size:16px;padding:15px;border:1px solid var(--line);border-radius:14px;background:#fff;margin:6px 0 14px}.memory{background:var(--soft);border-radius:15px;padding:12px;margin-bottom:14px;font-size:14px;line-height:1.55}.muted{opacity:.65;font-size:14px;line-height:1.6}.status{border-radius:14px;padding:10px 12px;font-size:13px;margin:8px 0}.status.ok{background:var(--ok)}.status.ng{background:#f7e2df}.row{display:flex;gap:8px}.row>*{flex:1}.summary{font-size:17px;line-height:1.9;margin:14px 0}.section-title{font-size:18px;font-weight:800;margin:4px 0 8px}
@media(min-width:600px){main{padding:24px}.card{min-height:700px}}
</style>
</head>
<body><main>
<section id="home" class="card hero">
  <img class="brand" src="assets/hirushika-hero.png" alt="ひるしか">
  <div class="title">ひるしか</div>
  <div class="sub">昼しか、見ない。<br>AIと話して、気づけば15分。</div>
  <div class="btns" style="width:100%">
    <button class="btn primary" onclick="showStart()">ランチする</button>
    <button class="btn" onclick="startConsult()">何食べる？</button>
    <button class="btn small ghost" onclick="showSettings()">AI接続設定</button>
    <button id="installBtn" class="btn hidden">ホーム画面に追加</button>
  </div>
  <p class="muted">Ver.0.5｜AIひるしか試作版</p>
</section>

<section id="settings" class="card hidden">
  <img class="mini" src="assets/hirushika-hero.png" alt="ひるしか">
  <div class="section-title">AI接続設定</div>
  <p class="muted">Cloudflare Workerを公開したあと、そのURLをここに貼ります。APIキーはスマホには保存しません。</p>
  <label>Worker URL</label>
  <input id="apiUrl" placeholder="https://hirushika-ai.xxxxx.workers.dev">
  <div id="apiStatus" class="status hidden"></div>
  <div class="btns">
    <button class="btn primary" onclick="saveApiUrl()">保存して接続確認</button>
    <button class="btn" onclick="goHome()">戻る</button>
  </div>
</section>

<section id="consult" class="card hidden">
  <img class="mini" src="assets/hirushika-hero.png" alt="ひるしか">
  <div class="meta"><span>何食べる？</span><span>自由会話</span></div>
  <div id="consultChat" class="chat"></div>
  <div id="consultQuick" class="quick"></div>
  <div class="composer">
    <textarea id="consultInput" placeholder="例：昨日飲みすぎた。今日は温かいものがいい"></textarea>
    <button class="btn primary send" onclick="sendConsult()">送る</button>
  </div>
  <div class="btns" style="margin-top:10px">
    <button id="useMenuBtn" class="btn hidden" onclick="useSuggestedMenu()">これでランチする</button>
    <button class="btn danger" onclick="goHome()">ホームへ戻る</button>
  </div>
</section>

<section id="start" class="card hidden">
  <img class="mini" src="assets/hirushika-hero.png" alt="ひるしか">
  <h2>今日のランチ</h2>
  <label>店・場所</label><input id="place" list="places" placeholder="例：だしや / 自宅 / 会社"><datalist id="places"></datalist>
  <div id="memory" class="memory hidden"></div>
  <label>メニュー</label><input id="menu" placeholder="例：回鍋肉定食">
  <label>量</label><select id="size"><option>普通</option><option>少なめ</option><option>大盛り</option><option>不明</option></select>
  <div class="btns"><button class="btn primary" onclick="startLunch()">ひるしかと食べる</button><button class="btn" onclick="goHome()">戻る</button></div>
</section>

<section id="lunch" class="card hidden">
  <img class="mini" src="assets/hirushika-hero.png" alt="ひるしか">
  <div class="meta"><span id="elapsed">0:00</span><span id="phaseLabel">まずは食べよう</span></div>
  <div class="progress"><div id="bar" style="width:0"></div></div>
  <div id="lunchChat" class="chat"></div>
  <div id="lunchQuick" class="quick"></div>
  <div class="composer">
    <textarea id="lunchInput" placeholder="自由に返してOK。『詳しく』『別の話』でも。"></textarea>
    <button id="lunchSend" class="btn primary send" onclick="sendLunch()">送る</button>
  </div>
  <div class="btns" style="margin-top:10px">
    <button id="continueBtn" class="btn" onclick="continueLunch()">続ける</button>
    <button id="finishBtn" class="btn danger" onclick="finishLunchManual()">食事を終了</button>
  </div>
</section>

<section id="finish" class="card hidden">
  <img class="mini" src="assets/hirushika-hero.png" alt="ひるしか">
  <h2>ごちそうさま。</h2>
  <div id="summary" class="summary"></div>
  <div class="btns"><button class="btn primary" onclick="goHome()">ホームへ</button></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
let startedAt=0,timer=null,deferredPrompt=null,continueLock=null;
let lunchState=null,consultState=null;
const HKEY='hirushika:history:v05', MKEY='hirushika:memory:v05', APIKEY='hirushika:apiUrl';

function hideAll(){['home','settings','consult','start','lunch','finish'].forEach(x=>$(x).classList.add('hidden'))}
function goHome(){clearInterval(timer);clearInterval(continueLock);hideAll();$('home').classList.remove('hidden');loadPlaces()}
function showSettings(){hideAll();$('settings').classList.remove('hidden');$('apiUrl').value=localStorage.getItem(APIKEY)||''}
async function saveApiUrl(){let u=$('apiUrl').value.trim().replace(/\/$/,'');localStorage.setItem(APIKEY,u);let s=$('apiStatus');s.className='status';s.classList.remove('hidden');s.textContent='接続確認中…';try{let r=await fetch(u+'/health');if(!r.ok)throw new Error();s.classList.add('ok');s.textContent='接続OK。AIひるしかを使えます。'}catch(e){s.classList.add('ng');s.textContent='接続できません。Worker URLを確認してください。'}}
function apiUrl(){return (localStorage.getItem(APIKEY)||'').replace(/\/$/,'')}
function requireApi(){if(!apiUrl()){showSettings();let s=$('apiStatus');s.className='status ng';s.classList.remove('hidden');s.textContent='先にAI接続設定が必要です。';return false}return true}

function appendMsg(elId,who,text,typing=false){let box=$(elId),d=document.createElement('div');d.className='msg '+(who==='ai'?'ai':'user')+(typing?' typing':'');d.textContent=(who==='ai'?'🦌 ':'')+text;box.appendChild(d);box.scrollTop=box.scrollHeight;return d}
function renderQuick(elId,items,handler,wait=0){let el=$(elId);el.innerHTML='';(items||[]).slice(0,4).forEach((t,i)=>{let b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>handler(t);el.appendChild(b);if(wait>0){b.disabled=true;setTimeout(()=>b.disabled=false,wait*1000)}})}
function loadMemory(){return JSON.parse(localStorage.getItem(MKEY)||'{}')}
function saveMemoryUpdates(arr){if(!Array.isArray(arr)||!arr.length)return;let m=loadMemory();arr.forEach(x=>{if(!x||!x.key)return;m[x.key]=x.value});localStorage.setItem(MKEY,JSON.stringify(m))}
function logs(){return JSON.parse(localStorage.getItem('hirushika:logs')||'[]')}
function recentMealSummary(){return logs().slice(-5).map(x=>({place:x.place,menu:x.menu,size:x.size,minutes:x.minutes,fullness:x.fullness,end:x.end}));}

async function callAI(mode,history,context={}){
  let u=apiUrl(); if(!u)throw new Error('API未設定');
  let r=await fetch(u+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode,history:history.slice(-16),context:{...context,memory:loadMemory(),recent_meals:recentMealSummary()}})});
  let j=await r.json().catch(()=>({})); if(!r.ok)throw new Error(j.error||'AI接続エラー'); return j;
}

function startConsult(){if(!requireApi())return;consultState={history:[],selectedMenu:null};hideAll();$('consult').classList.remove('hidden');$('consultChat').innerHTML='';$('consultQuick').innerHTML='';$('useMenuBtn').classList.add('hidden');appendMsg('consultChat','ai','昼だな。今日は何が食いたい？\n決まってなくてもいい。今の気分をそのまま言って。');consultState.history.push({role:'assistant',content:'昼だな。今日は何が食いたい？ 決まってなくてもいい。今の気分をそのまま言って。'});renderQuick('consultQuick',['腹ペコ','軽めがいい','昨日飲んだ','何も決まってない'],t=>sendConsultText(t));}
async function sendConsult(){let t=$('consultInput').value.trim();if(!t)return;$('consultInput').value='';await sendConsultText(t)}
async function sendConsultText(t){appendMsg('consultChat','user',t);consultState.history.push({role:'user',content:t});let ph=appendMsg('consultChat','ai','考え中…',true);try{let j=await callAI('consult',consultState.history,{});ph.remove();appendMsg('consultChat','ai',j.reply||'もう少し教えて。');consultState.history.push({role:'assistant',content:j.reply||''});saveMemoryUpdates(j.memory_updates);renderQuick('consultQuick',j.quick_replies,t=>sendConsultText(t));consultState.selectedMenu=j.selected_menu||null;if(consultState.selectedMenu){$('useMenuBtn').classList.remove('hidden');$('useMenuBtn').textContent=`「${consultState.selectedMenu}」でランチする`}else $('useMenuBtn').classList.add('hidden')}catch(e){ph.remove();appendMsg('consultChat','ai','うまくつながらなかった。もう一回だけ頼む。');}}
function useSuggestedMenu(){hideAll();$('start').classList.remove('hidden');loadPlaces();$('menu').value=consultState?.selectedMenu||'';$('place').focus()}

function showStart(){hideAll();$('start').classList.remove('hidden');loadPlaces();$('place').oninput=showMemory}
function loadPlaces(){let d=$('places');if(!d)return;d.innerHTML=[...new Set(logs().map(x=>x.place).filter(Boolean))].map(p=>`<option value="${p.replaceAll('"','&quot;')}">`).join('')}
function showMemory(){let p=$('place').value.trim(),ls=logs().filter(x=>x.place===p),el=$('memory');if(!ls.length){el.classList.add('hidden');return}let x=ls.at(-1);el.classList.remove('hidden');el.textContent=`🦌 前回：${x.menu} / ${x.size} / ${x.fullness}分目 / ${x.minutes}分。${x.end==='B'?'少なめ候補だった。':''}`}

function secs(){return Math.floor((Date.now()-startedAt)/1000)}
function phase(){let s=secs();if(s<240)return 'opening';if(s<480)return 'middle1';if(s<720)return 'middle2';if(s<900)return 'late';return 'after15'}
function phaseJa(){return {opening:'まずは食べよう',middle1:'ゆっくりいこう',middle2:'いい昼だ',late:'そろそろ15分',after15:'15分経過'}[phase()]}
function tick(){let s=secs(),m=Math.floor(s/60),r=s%60;$('elapsed').textContent=`${m}:${String(r).padStart(2,'0')}`;$('bar').style.width=Math.min(100,(s/900)*100)+'%';$('phaseLabel').textContent=phaseJa();if(s>=900){$('finishBtn').classList.remove('danger');$('finishBtn').classList.add('primary')}}

async function startLunch(){if(!requireApi())return;lunchState={place:$('place').value.trim()||'未登録',menu:$('menu').value.trim()||'未登録',size:$('size').value,history:[],fullness:[],interestTopics:[],full1:false,full2:false};startedAt=Date.now();hideAll();$('lunch').classList.remove('hidden');$('lunchChat').innerHTML='';$('lunchQuick').innerHTML='';$('finishBtn').className='btn danger';tick();timer=setInterval(tick,1000);await aiLunchTurn('ランチ開始。自然に一言話しかけて。最初から質問攻めにしないで。',true)}
function lunchContext(){let s=secs();let due=(s>=420&&!lunchState.full1)?'first':(s>=720&&!lunchState.full2)?'second':'none';return {elapsed_seconds:s,phase:phase(),place:lunchState.place,menu:lunchState.menu,size:lunchState.size,fullness_due:due,known_fullness:lunchState.fullness}}
async function aiLunchTurn(userText,isSystem=false){if(!isSystem){appendMsg('lunchChat','user',userText);lunchState.history.push({role:'user',content:userText})}let ph=appendMsg('lunchChat','ai','ちょっと考えてる…',true);disableLunch(true);try{let h=[...lunchState.history];if(isSystem)h.push({role:'user',content:userText});let j=await callAI('lunch',h,lunchContext());ph.remove();appendMsg('lunchChat','ai',j.reply||'まあ、少し食べよう。');lunchState.history.push({role:'assistant',content:j.reply||''});saveMemoryUpdates(j.memory_updates);if(j.fullness_value){let n=Number(j.fullness_value);if(n>=1&&n<=10){lunchState.fullness.push(n);if(secs()>=720)lunchState.full2=true;else lunchState.full1=true}}renderQuick('lunchQuick',j.quick_replies,t=>aiLunchTurn(t),8);setContinueLock(10);disableLunch(false)}catch(e){ph.remove();appendMsg('lunchChat','ai','通信が切れた。飯は逃げない。少し食べて、もう一回。');setContinueLock(6);disableLunch(false)}}
function disableLunch(on){$('lunchSend').disabled=on;$('lunchInput').disabled=on}
async function sendLunch(){let t=$('lunchInput').value.trim();if(!t)return;$('lunchInput').value='';await aiLunchTurn(t)}
function continueLunch(){aiLunchTurn('話を自然に続けて。直前の話を深めるか、少し食べる間を作るか、別の面白い話題に移って。唐突なクイズは禁止。')}
function setContinueLock(n){clearInterval(continueLock);let b=$('continueBtn'),left=n;b.disabled=true;b.textContent=`続ける　あと${left}秒`;continueLock=setInterval(()=>{left--;if(left<=0){clearInterval(continueLock);b.disabled=false;b.textContent='続ける'}else b.textContent=`続ける　あと${left}秒`},1000)}
function finishLunchManual(){if(secs()<900&&!confirm('まだ15分前だけど、今日はここで終える？'))return;finishLunch()}
function finishLunch(){clearInterval(timer);clearInterval(continueLock);let min=Math.max(1,Math.round(secs()/60)),f=lunchState.fullness.at(-1)||'-';let end=secs()>=900?'C':'manual';let rec={date:new Date().toISOString(),place:lunchState.place,menu:lunchState.menu,size:lunchState.size,minutes:min,fullness:f,end};let ls=logs();ls.push(rec);localStorage.setItem('hirushika:logs',JSON.stringify(ls));hideAll();$('finish').classList.remove('hidden');$('summary').innerHTML=`<b>${min}分。</b><br>${lunchState.place} / ${lunchState.menu} / ${lunchState.size}<br>最後に記録できた満腹度：<b>${f}分目</b><br><br>🦌 ${min>=15?'気づけば15分。今日はそれで十分。':'今日は短め。そういう昼もある。'}<br><br><span class="muted">夜のことは知らん。俺、ひるしかだから。</span>`}

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('installBtn').classList.remove('hidden')});
$('installBtn').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('installBtn').classList.add('hidden')}};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
loadPlaces();
</script>
</body></html>
