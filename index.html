<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4b3427"><meta name="apple-mobile-web-app-capable" content="yes"><title>ひるしか Ver.0.21 |  Ver.0.2</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{--bg:#f6efe4;--card:#fffaf2;--ink:#4b3427;--accent:#c78c52;--line:#e6d3bf}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Noto Sans JP','Segoe UI',sans-serif;background:var(--bg);color:var(--ink)}main{max-width:560px;margin:auto;min-height:100dvh;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:0 10px 30px #6b4b2d18;min-height:calc(100dvh - 32px);display:flex;flex-direction:column}.hidden{display:none}.hero{align-items:center;text-align:center;justify-content:center}.brand{width:170px;height:170px;object-fit:cover;object-position:42% 48%;border-radius:50%;margin-bottom:10px}.mini{width:76px;height:76px;object-fit:cover;object-position:42% 48%;border-radius:50%;display:block;margin:0 auto 8px}.title{font-size:38px;font-weight:900}.sub{opacity:.75;line-height:1.7;margin:4px 0 28px}.btns{display:grid;gap:10px;margin-top:auto}.btn{width:100%;min-height:56px;border-radius:17px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:17px;font-weight:750;padding:13px 15px}.primary{background:var(--ink);color:#fff;border-color:var(--ink)}input,select{width:100%;font-size:16px;padding:15px;border:1px solid var(--line);border-radius:14px;background:#fff;margin:6px 0 14px}.bubble{white-space:pre-line;font-size:20px;line-height:1.7;margin:12px 0 20px}.meta{display:flex;justify-content:space-between;font-size:13px;opacity:.65}.progress{height:8px;background:#eadbcb;border-radius:99px;overflow:hidden;margin:10px 0}.progress div{height:100%;background:var(--accent)}.muted{opacity:.65;font-size:14px;line-height:1.6}.memory{background:#f0e3d5;border-radius:15px;padding:12px;margin-bottom:14px;font-size:14px;line-height:1.55}.summary{font-size:17px;line-height:1.9;margin:14px 0}.install{margin-top:12px}@media(min-width:600px){main{padding:24px}.card{min-height:700px}}
</style></head><body><main>
<section id="home" class="card hero"><img class="brand" src="assets/hirushika-hero.png" alt="ひるしか"><div class="title">ひるしか</div><div class="sub">昼しか、見ない。<br>食べる時間を、ちょっと楽しく。</div><div class="btns" style="width:100%"><button class="btn primary" onclick="showStart()">ランチ</button><button id="installBtn" class="btn install hidden">ホーム画面に追加</button></div><p class="muted">Ver.0.2｜スマホ実食テスト版</p></section>
<section id="start" class="card hidden"><img class="mini" src="assets/hirushika-hero.png"><h2>今日のランチ</h2><label>店・場所</label><input id="place" list="places" placeholder="例：だしや / 自宅 / 会社"><datalist id="places"></datalist><div id="memory" class="memory hidden"></div><label>メニュー</label><input id="menu" placeholder="例：回鍋肉定食"><label>量</label><select id="size"><option>普通</option><option>少なめ</option><option>大盛り</option><option>不明</option></select><div class="btns"><button class="btn primary" onclick="startLunch()">ひるしかと食べる</button><button class="btn" onclick="goHome()">戻る</button></div></section>
<section id="lunch" class="card hidden"><img class="mini" src="assets/hirushika-hero.png"><div class="meta"><span id="elapsed">0分</span><span>目安 15〜20分</span></div><div class="progress"><div id="bar" style="width:0"></div></div><div id="bubble" class="bubble"></div><div id="controls" class="btns"></div></section>
<section id="finish" class="card hidden"><img class="mini" src="assets/hirushika-hero.png"><h2>ごちそうさま。</h2><div id="summary" class="summary"></div><div class="btns"><button class="btn primary" onclick="goHome()">ホームへ</button></div></section>
</main><script>
const $=id=>document.getElementById(id);let startedAt=0,timer=null,deferredPrompt=null;
let S={}; const trivia=[
{q:'世界最古級の自動販売機で売られていたものは？',o:['A：ワイン','B：聖水','C：パン'],a:'B',d:'古代アレクサンドリアの技術者ヘロンが記した装置。硬貨の重みで弁が開き、一定量の聖水が出る仕組みです。'},
{q:'「restaurant」という言葉の源に近い意味は？',o:['A：回復させるもの','B：旅人の宿','C：共同の食卓'],a:'A',d:'18世紀パリで、体力を回復させる滋養のある料理などを指す語から、店の呼び名へ広がったとされます。'},
{q:'同じ刺激にだんだん反応しなくなる現象は？',o:['A：ハロー効果','B：馴化','C：カクテルパーティー効果'],a:'B',d:'馴化。匂いや音など、同じ刺激が続くと反応が弱くなっていく現象です。'},
{q:'「おやつ」の語源と関係が深いのは？',o:['A：八つ時','B：八種類の菓子','C：八日市'],a:'A',d:'江戸時代の時刻「八つ時」ごろに軽食をとる習慣から「お八つ」と呼ばれるようになったとされます。'}];
function hide(){['home','start','lunch','finish'].forEach(x=>$(x).classList.add('hidden'))}function goHome(){clearInterval(timer);hide();$('home').classList.remove('hidden');loadPlaces()}function showStart(){hide();$('start').classList.remove('hidden');loadPlaces();$('place').oninput=showMemory}
function loadPlaces(){let logs=JSON.parse(localStorage.getItem('hirushika:logs')||'[]');let ps=[...new Set(logs.map(x=>x.place).filter(Boolean))];$('places').innerHTML=ps.map(p=>`<option value="${p.replaceAll('"','&quot;')}">`).join('')}
function showMemory(){let p=$('place').value.trim(),logs=JSON.parse(localStorage.getItem('hirushika:logs')||'[]').filter(x=>x.place===p);let el=$('memory');if(!logs.length){el.classList.add('hidden');return}let x=logs.at(-1);el.classList.remove('hidden');el.textContent=`🦌 前回：${x.menu} / ${x.size} / ${x.fullness}分目 / ${x.minutes}分。${x.end==='B'?'少なめ候補だった。':''}`}
function startLunch(){S={place:$('place').value.trim()||'未登録',menu:$('menu').value.trim()||'未登録',size:$('size').value,full:[],rating:null,idx:0,interests:[]};startedAt=Date.now();hide();$('lunch').classList.remove('hidden');let logs=JSON.parse(localStorage.getItem('hirushika:logs')||'[]').filter(x=>x.place===S.place);let prev=logs.at(-1);say(prev?`🦌 ここ、前にも来たな。\n前回は「${prev.menu}」、最後は${prev.fullness}分目。\n\nでも今日は今日。まず食おう。`:'🦌 昼だな。食おう。\n\n最初の数口は、何も考えなくていい。',[['次',()=>firstImpression()]]);tick();timer=setInterval(tick,15000)}
function tick(){let m=Math.floor((Date.now()-startedAt)/60000);$('elapsed').textContent=m+'分';$('bar').style.width=Math.min(100,(m/18)*100)+'%'}
function say(text,buttons){$('bubble').textContent=text;let c=$('controls');c.innerHTML='';buttons.forEach(([t,f])=>{let b=document.createElement('button');b.className='btn';b.textContent=t;b.onclick=f;c.appendChild(b)})}
function firstImpression(){choice('今日の第一印象は？',['A：期待よりうまい','B：だいたい期待どおり','C：ちょっと期待外れ'],v=>{S.rating=v;quiz(0,()=>sensory())})}
function choice(q,opts,cb){say('🦌 '+q,opts.map(x=>[x,()=>cb(x[0])]))}
function quiz(i,next){let t=trivia[i%trivia.length];choice(t.q,t.o,v=>say(`🦌 ${v===t.a?'正解。':'正解は '+t.a+'。'}\n\n${t.d}`,[["詳しく",()=>{S.interests.push(t.q);say('🦌 もう少しだけ。\n\n'+t.d+'\n\nこういう話、好きそうだな。',[['次',next]])}],['次',next]]))}
function sensory(){say('🦌 次の一口だけ、普段どおり。\n\n食べ終わった瞬間に、どうだった？',[['A：もう少し噛んでもよかった',()=>play()],['B：ちょうどいい',()=>play()],['C：十分噛んでる',()=>play()]])}
function play(){choice('一生どちらかなら？',['A：毎日めちゃくちゃ旨い同じ料理','B：毎日違う「まあまあ」の料理'],()=>quiz(2,()=>fullness(1)))}
function fullness(n){say('🦌 いま、腹何分目？',[4,5,6,7,8,9,10].map(x=>[String(x),()=>{S.full.push(x);if(n===1)quiz(3,()=>recheck());else ending()}]))}
function recheck(){say('🦌 今日の料理、最初と比べて評価は？',[['A：上がった',()=>fullness(2)],['B：変わらない',()=>fullness(2)],['C：下がった',()=>fullness(2)]])}
function ending(){say('🦌 いま、どんな感じ？',[['A：まだ食べたいし、まだ残ってる',()=>finish('A')],['B：もう十分。でもまだ残ってる',()=>finish('B')],['C：ちょうど食べ終わった',()=>finish('C')]])}
function finish(end){clearInterval(timer);let min=Math.max(1,Math.round((Date.now()-startedAt)/60000)),f=S.full.at(-1)||'-';let log={date:new Date().toISOString(),place:S.place,menu:S.menu,size:S.size,minutes:min,fullness:f,end,rating:S.rating,interests:S.interests};let logs=JSON.parse(localStorage.getItem('hirushika:logs')||'[]');logs.push(log);localStorage.setItem('hirushika:logs',JSON.stringify(logs));let advice=end==='B'?'この量は少し多かったかも。次は「少なめ」を試す候補。':end==='C'?(Number(f)>=9?'食べ切ったけど、次は少し量を下げてもよさそう。':'この量はちょうどいい候補。'):'まだ食べたい余地があった。';hide();$('finish').classList.remove('hidden');$('summary').innerHTML=`<b>${min}分。</b><br>最後は <b>${f}分目</b>。<br>${S.place} / ${S.menu} / ${S.size}<br><br>🦌 ${advice}<br><br><span class="muted">夜のことは知らん。俺、ひるしかだから。</span>`}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('installBtn').classList.remove('hidden')});$('installBtn').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('installBtn').classList.add('hidden')}};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));loadPlaces();
</script></body></html>
